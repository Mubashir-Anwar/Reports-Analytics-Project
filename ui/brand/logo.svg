<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 64 64" role="img" aria-label="Analysis">
  <!-- circle, bar and tall bar; where they overlap the colours multiply (like ink) -->
  <g style="isolation:isolate">
    <circle cx="21" cy="45" r="13" fill="#e23c8f"/>
    <rect x="28" y="22" width="16" height="36" rx="8" fill="#2ea3dd" style="mix-blend-mode:multiply"/>
    <rect x="40" y="6" width="16" height="52" rx="8" fill="#f6a11a" style="mix-blend-mode:multiply"/>
  </g>
</svg>
