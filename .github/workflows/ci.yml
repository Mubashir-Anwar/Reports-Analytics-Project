name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  backend:
    name: Backend (lint + tests)
    runs-on: ubuntu-latest
    services:
      postgres:  # real PostgreSQL for tests/test_sql_reports.py (read-only, time limit, parameters)
        image: postgres:16
        env:
          POSTGRES_USER: reporting_test
          POSTGRES_PASSWORD: reporting_test
          POSTGRES_DB: reporting_test
        ports: ["5432:5432"]
        options: >-
          --health-cmd "pg_isready -U reporting_test" --health-interval 5s --health-timeout 5s --health-retries 10
      mysql:  # real MySQL for tests/test_sql_dialects.py (read-only transaction, IN lists, Read Fields)
        image: mysql:8.4
        env:
          MYSQL_ROOT_PASSWORD: reporting_root
          MYSQL_DATABASE: reporting_test
          MYSQL_USER: reporting_test
          MYSQL_PASSWORD: reporting_test
        ports: ["3306:3306"]
        options: >-
          --health-cmd "mysqladmin ping -h 127.0.0.1 -ureporting_test -preporting_test" --health-interval 5s --health-timeout 5s --health-retries 20
      mongodb:  # real MongoDB for tests/test_system_db.py (document store, run log, audit chain, GridFS)
        image: mongo:8.0
        ports: ["27017:27017"]
        options: >-
          --health-cmd "mongosh --quiet --eval 'db.runCommand({ping:1}).ok'" --health-interval 5s --health-timeout 5s --health-retries 20
    env:
      PG_TEST_URL: postgresql://reporting_test:reporting_test@127.0.0.1:5432/reporting_test
      MYSQL_TEST_URL: mysql://reporting_test:reporting_test@127.0.0.1:3306/reporting_test
      MONGO_TEST_URL: mongodb://127.0.0.1:27017
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v7
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: |
            requirements-dev.txt
            constraints.txt
      # the exact versions the Docker image ships (constraints.txt): an update pull request is tested with its new versions
      - run: pip install -r requirements-dev.txt -c constraints.txt
      - name: Lint (undefined/unused names, imports)
        run: ruff check .
      - name: Tests
        shell: bash
        run: |
          set +e
          pytest -q -rfE 2>&1 | tee pytest.log
          status=${PIPESTATUS[0]}
          # failures as annotations: visible on the run page and through the public API, without the log
          grep -E "^(FAILED|ERROR) " pytest.log | head -30 | sed 's/^/::error title=pytest::/'
          exit $status

  system-db:
    name: System database on SQL Server and Oracle
    runs-on: ubuntu-latest
    services:
      sqlserver:
        image: mcr.microsoft.com/mssql/server:2022-latest
        env:
          ACCEPT_EULA: "Y"
          MSSQL_SA_PASSWORD: Reporting_Test_123
        ports: ["1433:1433"]
        options: >-
          --health-cmd "/opt/mssql-tools18/bin/sqlcmd -C -S localhost -U sa -P Reporting_Test_123 -Q 'SELECT 1' || exit 1"
          --health-interval 10s --health-timeout 5s --health-retries 20
      oracle:
        image: gvenzl/oracle-free:23-slim
        env:
          ORACLE_PASSWORD: reporting_test
          APP_USER: reporting_test
          APP_USER_PASSWORD: reporting_test
        ports: ["1521:1521"]
        options: >-
          --health-cmd healthcheck.sh --health-interval 10s --health-timeout 5s --health-retries 30
    env:
      MSSQL_TEST_URL: sqlserver://sa:Reporting_Test_123@127.0.0.1:1433/master
      ORACLE_TEST_URL: oracle://reporting_test:reporting_test@127.0.0.1:1521/?service_name=FREEPDB1
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v7
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: |
            requirements-dev.txt
            constraints.txt
      # the exact versions the Docker image ships (constraints.txt): an update pull request is tested with its new versions
      - run: pip install -r requirements-dev.txt -c constraints.txt
      - name: Run the system database tests on SQL Server and Oracle
        shell: bash
        run: |
          set +e
          pytest -q -rfE tests/test_system_db.py -k "sqlserver or oracle" 2>&1 | tee pytest.log
          status=${PIPESTATUS[0]}
          grep -E "^(FAILED|ERROR) " pytest.log | head -30 | sed 's/^/::error title=pytest::/'
          exit $status

  frontend:
    name: Frontend build
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - run: npm ci --no-audit --no-fund
      - run: npm run build

  docker:
    name: Docker image
    runs-on: ubuntu-latest
    needs: [backend, frontend, system-db]
    steps:
      - uses: actions/checkout@v4
      - name: Build the image (not pushed)
        run: docker build -t mongo-reporting:ci .
      - name: Start it and wait for an HTTP answer
        run: |
          docker run -d --name svc -p 8000:8000 -e REPORTING_ADMIN_TOKEN=ci-admin-token-0123456789-abcdef mongo-reporting:ci
          for i in $(seq 1 30); do
            code=$(curl -s -o /dev/null -w "%{http_code}" http://127.0.0.1:8000/health || true)
            if [ "$code" != "000" ]; then echo "health answered $code"; break; fi
            sleep 1
          done
          docker logs svc | tail -20
          test "$code" != "000"
      - name: Packages, fonts and folders inside the image
        run: |
          docker exec svc python -m backend.app.setup --check
          docker exec svc python -c "from backend.app.fonts import right_to_left_family as f; assert f(), 'no font with Urdu letters'"
          docker exec svc sh -c 'touch /data/analytics/x /data/exports/x && rm /data/analytics/x /data/exports/x'
      - name: Compose file
        run: python3 deploy/make_env.py && docker compose -f deploy/docker-compose.yml --env-file deploy/.env config --quiet
