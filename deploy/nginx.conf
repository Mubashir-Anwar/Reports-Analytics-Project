# nginx in front of the reporting service: HTTPS, load balancing over the app instances, sane limits.
upstream reporting {
    # One caller (session cookie, else API key, else address) always reaches the same instance: a "deliver later"
    # ticket (X-Deliver: later) lives in the instance that made it, so its status and file must be asked there.
    # "consistent": when an instance is added or removed, only its own callers move.
    hash $cookie_rs_session$http_x_api_key$remote_addr consistent;
    server app-1:8000 max_fails=3 fail_timeout=10s;
    server app-2:8000 max_fails=3 fail_timeout=10s;
    keepalive 16;
}

server {
    listen 80;
    server_name _;
    return 301 https://$host$request_uri;
}

server {
    listen 443 ssl;
    http2 on;
    server_name _;

    ssl_certificate     /etc/nginx/certs/fullchain.pem;
    ssl_certificate_key /etc/nginx/certs/privkey.pem;
    ssl_protocols TLSv1.2 TLSv1.3;
    ssl_session_cache shared:SSL:10m;

    client_max_body_size 25m;          # = REPORTING_MAX_BODY_MB
    proxy_read_timeout 300s;           # big reports; use "Run in background" for longer ones
    gzip on;
    gzip_types text/css application/javascript application/json text/csv image/svg+xml;

    location / {
        proxy_pass http://reporting;
        proxy_http_version 1.1;
        proxy_set_header Connection "";
        proxy_set_header Host $host;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    location /assets/ {
        proxy_pass http://reporting;
        expires 7d;
        add_header Cache-Control "public, immutable";
    }
}
