# Production-style stack: nginx (HTTPS) → two app instances → PostgreSQL (the shared repository / storage).
#
#   cp deploy/.env.example deploy/.env      # then fill in the secrets
#   docker compose -f deploy/docker-compose.yml --env-file deploy/.env up -d --build
#
# Reports still read from your own MongoDB / SQL databases (data adapters); this PostgreSQL only stores the
# service's own data: reports, versions, users, schedules, outputs, audit log. Analytics datasets (Parquet files)
# are on the shared volume "analytics", so every instance reads the same imports.
name: reporting

services:
  storage-db:
    image: postgres:16
    restart: unless-stopped
    environment:
      POSTGRES_DB: reporting
      POSTGRES_USER: reporting
      POSTGRES_PASSWORD: ${STORAGE_DB_PASSWORD:?set STORAGE_DB_PASSWORD in deploy/.env}
    volumes:
      - storage-db:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U reporting -d reporting"]
      interval: 5s
      retries: 20

  # The first instance also runs the report scheduler; scale the web side with app-2, app-3 … (scheduler off).
  app-1: &app
    build: ..
    restart: unless-stopped
    depends_on:
      storage-db:
        condition: service_healthy
    volumes:
      - analytics:/data/analytics
    environment: &app-env
      REPORTING_STORAGE: postgresql
      REPORTING_STORAGE_URL: postgresql://reporting:${STORAGE_DB_PASSWORD}@storage-db:5432/reporting
      REPORTING_ADMIN_TOKEN: ${REPORTING_ADMIN_TOKEN:?set REPORTING_ADMIN_TOKEN}
      REPORTING_SESSION_SECRET: ${REPORTING_SESSION_SECRET:?set REPORTING_SESSION_SECRET (same in every instance)}
      REPORTING_ACCESS_SECRET: ${REPORTING_ACCESS_SECRET:-}
      REPORTING_SECRETS_KEY: ${REPORTING_SECRETS_KEY:?set REPORTING_SECRETS_KEY (encrypts adapter passwords)}
      REPORTING_TRUSTED_PROXIES: 172.16.0.0/12,10.0.0.0/8,192.168.0.0/16
      REPORTING_SECURE_COOKIES: "true"
      REPORTING_HSTS: "true"
      REPORTING_TIMEZONE: ${REPORTING_TIMEZONE:-UTC}
      REPORTING_SCHEDULER: "on"
      MONGODB_URI: ${MONGODB_URI:-}
      MONGODB_DATABASE: ${MONGODB_DATABASE:-}
      SMTP_HOST: ${SMTP_HOST:-}
      SMTP_PORT: ${SMTP_PORT:-587}
      SMTP_USER: ${SMTP_USER:-}
      SMTP_PASSWORD: ${SMTP_PASSWORD:-}
      SMTP_FROM: ${SMTP_FROM:-}

  app-2:
    <<: *app
    environment:
      <<: *app-env
      REPORTING_SCHEDULER: "off"

  proxy:
    image: nginx:1.27-alpine
    restart: unless-stopped
    depends_on: [app-1, app-2]
    ports: ["80:80", "443:443"]
    volumes:
      - ./nginx.conf:/etc/nginx/conf.d/default.conf:ro
      - ./certs:/etc/nginx/certs:ro   # fullchain.pem + privkey.pem (e.g. from Let's Encrypt)

volumes:
  storage-db:
  analytics:
